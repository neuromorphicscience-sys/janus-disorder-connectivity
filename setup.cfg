[metadata]
name = janus-disorder-connectivity
version = 1.0.0
description = Reproducibility code for disorder-restored strong connectivity in degree-limited spatial networks

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.23
    scipy>=1.9
    pandas>=1.5
    matplotlib>=3.6
    numba>=0.56
    Pillow>=9.0

[options.packages.find]
where = src
